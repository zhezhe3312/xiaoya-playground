,.2,'sine',.15,.2)}function sndWrong(){beep(200,.2,'sawtooth',.08);beep(150,.3,'sawtooth',.08,.15)}function sndReward(){beep(523,.1,'sine',.12);beep(659,.1,'sine',.12,.1);beep(784,.1,'sine',.12,.2);beep(1047,.25,'sine',.15,.3)}function speak(text,lang){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=lang||'zh-CN';u.rate=.85;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}function speakCN(t){speak(t,'zh-CN')}function speakEN(t){speak(t,'en-US')}const ISLANDS=[{key:'pinyin',cls:'pinyin',name:'拼音岛',sub:'完整声母韵母 · 点读发音',glyph:'a o e',color:'#FF8A5C',done:()=>save.pinyinDone,total:8},{key:'math',cls:'math',name:'数学岛',sub:'数字分成合成 · 1到10',glyph:'5=2+3',color:'#3FBF86',done:()=>save.mathDone,total:10},{key:'stroke',cls:'stroke',name:'笔画岛',sub:'基本笔画 · 跟着描红',glyph:'一丨丿',color:'#9E7BE0',done:()=>save.strokeDone,total:6},{key:'english',cls:'english',name:'英语岛',sub:'字母单词 · 英语启蒙',glyph:'ABC',color:'#5B9BF3',done:()=>save.engDone,total:6},{key:'poem',cls:'poem',name:'古诗岛',sub:'经典古诗 · 朗读跟读',glyph:'咏鹅',color:'#2EB8A5',done:()=>save.poemDone,total:4},{key:'history',cls:'history',name:'历史岛',sub:'历史故事 · 成语典故',glyph:'曹冲',color:'#C68B59',done:()=>save.histDone,total:4}];const PINYIN_LESSONS=[{letters:['a','o','e'],desc:'单韵母'},{letters:['i','u','ü'],desc:'单韵母'},{letters:['b','p','m','f'],desc:'声母'},{letters:['d','t','n','l'],desc:'声母'},{letters:['g','k','h'],desc:'声母'},{letters:['j','q','x'],desc:'声母'},{letters:['zh','ch','sh','r'],desc:'声母'},{letters:['z','c','s','y','w'],desc:'声母'}];const ENG_LESSONS=[{type:'letters',items:['A','B','C','D'],desc:'字母'},{type:'letters',items:['E','F','G','H'],desc:'字母'},{type:'words',items:[['one','1'],['two','2'],['three','3']],desc:'数字单词'},{type:'words',items:[['red','红色'],['blue','蓝色'],['green','绿色']],desc:'颜色单词'},{type:'words',items:[['cat','猫'],['dog','狗'],['bird','鸟']],desc:'动物单词'},{type:'words',items:[['apple','苹果'],['banana','香蕉'],['sun','太阳']],desc:'生活单词'}];const POEMS=[{title:'咏鹅',author:'唐 · 骆宾王',lines:['鹅，鹅，鹅，','曲项向天歌。','白毛浮绿水，','红掌拨清波。']},{title:'静夜思',author:'唐 · 李白',lines:['床前明月光，','疑是地上霜。','举头望明月，','低头思故乡。']},{title:'悯农',author:'唐 · 李绅',lines:['锄禾日当午，','汗滴禾下土。','谁知盘中餐，','粒粒皆辛苦。']},{title:'春晓',author:'唐 · 孟浩然',lines:['春眠不觉晓，','处处闻啼鸟。','夜来风雨声，','花落知多少。']}];const HISTORIES=[{title:'曹冲称象',text:'孙权送给曹操一头大象，曹操想知道大象有多重，可大臣们都想不出办法。曹操七岁的儿子曹冲说：把大象赶到船上，在船下沉的地方刻上记号。再往船上装石头，直到船沉到同样的记号。称一称石头有多重，就知道大象有多重了。大家照做，果然称出了大象的重量。'},{title:'司马光砸缸',text:'古时候有个孩子叫司马光。一天，他和小伙伴们在院子里玩，一个小孩不小心掉进了大水缸里。别的孩子都吓哭了，司马光却没有慌。他搬起一块大石头，使劲砸向水缸。水缸破了，水涌了出来，掉在缸里的小朋友也得救了。'},{title:'孔融让梨',text:'孔融四岁的时候，和哥哥们一起吃梨。他总是拿最小的梨。大人问他为什么，他说：我年纪小，应该吃小的，大的留给哥哥们。孔融懂礼貌、知道谦让的故事，流传了一千多年。'},{title:'大禹治水',text:'很久很久以前，洪水经常泛滥。大禹带领人们挖河道、修堤坝，三过家门而不入。经过十三年的努力，终于把洪水引到大海里去，百姓又能安居乐业了。大禹治水的故事告诉我们：遇到困难不要怕，坚持就能成功。'}];const STORY=[{img:'https://aka.doubaocdn.com/s/QmvBVWppXE',title:'菜园里的大萝卜',text:'春天到了，芽芽兔来到自己的小菜园。哇，土里长出了一个好大的胡萝卜！它哼哧哼哧拔呀拔……'},{img:'https://aka.doubaocdn.com/s/xC2PwRHOaJ',title:'树下的新朋友',text:'芽芽兔抱着胡萝卜回家，大树下遇到了一只捧着橡果的小松鼠。"你好呀！我叫松松。"它们成了好朋友。'},{img:'https://aka.doubaocdn.com/s/QmvBVWppXE',title:'分享真快乐',text:'芽芽兔把大胡萝卜切成两半，和松松一人一半。"真甜呀！"两个好朋友坐在阳光下，吃得肚子圆滚滚。'},{img:'https://aka.doubaocdn.com/s/xC2PwRHOaJ',title:'一起学拼音',text:'芽芽兔说："我们来学拼音吧！a a a，张大嘴巴 a a a。"松松跟着读："a a a！"它们学得可认真了。'},{img:'https://aka.doubaocdn.com/s/QmvBVWppXE',title:'数字宝宝做游戏',text:'松松拿出三颗松果："你看，三颗松果可以分成一颗和两颗，也可以分成两颗和一颗。"芽芽兔学会了数字分成！'},{img:'https://aka.doubaocdn.com/s/xC2PwRHOaJ',title:'松松的橡果树',text:'秋天到了，松松带芽芽兔去看它的橡果树。满树的橡果晃呀晃，像在和它们招手。'},{img:'https://aka.doubaocdn.com/s/QmvBVWppXE',title:'古诗里的秋天',text:'芽芽兔念起了古诗："锄禾日当午，汗滴禾下土。"松松说："我以后再也不浪费食物了。"'},{img:'https://aka.doubaocdn.com/s/xC2PwRHOaJ',title:'英语小课堂',text:'芽芽兔教松松说英语："Apple, apple, 苹果！"松松跟读："Apple！"两个好朋友都笑了。'},{img:'https://aka.doubaocdn.com/s/QmvBVWppXE',title:'第一场雪',text:'冬天的第一场雪落下来，菜园盖上了白白的被子。芽芽兔盼着春天再来，好种下新的蔬菜。'},{img:'https://aka.doubaocdn.com/s/xC2PwRHOaJ',title:'勇敢的司马光',text:'松松讲了司马光砸缸的故事。芽芽兔说："遇到危险要冷静，不能慌。"它们约定要做勇敢的孩子。'},{img:'https://aka.doubaocdn.com/s/QmvBVWppXE',title:'写下新年愿望',text:'芽芽兔在纸条上写："明年要学会更多拼音和古诗！"它把纸条埋在菜园里，等春天发芽。'},{img:'https://aka.doubaocdn.com/s/xC2PwRHOaJ',title:'好朋友，明年见',text:'芽芽兔和松松约定，明年春天还要一起在菜园里学知识、种蔬菜。它们挥挥手，期待着下一次冒险。'}];function mathQuestion(n){const a=1+Math.floor(Math.random()*(n-1));const b=n-a;const opts=new Set([a+'和'+b]);while(opts.size<4){const x=1+Math.floor(Math.random()*n);const y=n-x;if(y>0)opts.add(x+'和'+y)}return{q:n+'可以分成几和几？',answer:a+'和'+b,options:[...opts]}}const STROKES=[{name:'横（一）',draw:ctx=>{ctx.strokeStyle='#FFD0A0';ctx.lineWidth=10;ctx.lineCap='round';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(40,110);ctx.lineTo(280,110);ctx.stroke();ctx.setLineDash([])}},{name:'竖（丨）',draw:ctx=>{ctx.strokeStyle='#FFD0A0';ctx.lineWidth=10;ctx.lineCap='round';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(160,40);ctx.lineTo(160,180);ctx.stroke();ctx.setLineDash([])}},{name:'撇（丿）',draw:ctx=>{ctx.strokeStyle='#FFD0A0';ctx.lineWidth=10;ctx.lineCap='round';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(200,50);ctx.lineTo(80,180);ctx.stroke();ctx.setLineDash([])}},{name:'捺（㇏）',draw:ctx=>{ctx.strokeStyle='#FFD0A0';ctx.lineWidth=10;ctx.lineCap='round';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(100,50);ctx.lineTo(240,180);ctx.stroke();ctx.setLineDash([])}},{name:'点（丶）',draw:ctx=>{ctx.strokeStyle='#FFD0A0';ctx.lineWidth=10;ctx.lineCap='round';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(160,60);ctx.lineTo(130,120);ctx.stroke();ctx.setLineDash([])}},{name:'折（㇕）',draw:ctx=>{ctx.strokeStyle='#FFD0A0';ctx.lineWidth=10;ctx.lineCap='round';ctx.setLineDash([8,8]);ctx.beginPath();ctx.moveTo(80,60);ctx.lineTo(220,60);ctx.lineTo(220,160);ctx.stroke();ctx.setLineDash([])}}];const $=s=>document.querySelector(s);const $$=s=>document.querySelectorAll(s);function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800)}function renderIslands(){$('#islandList').innerHTML=ISLANDS.map(is=>{const done=is.done(),total=is.total;let nodes='';for(let j=0;j<total;j++){if(j<done)nodes+='<div class="node done">✓</div>';else if(j===done)nodes+='<div class="node now">'+(j+1)+'</div>';else nodes+='<div class="node lock">🔒</div>';if(j<total-1)nodes+='<div class="road'+(j<done?' done':'')+'"></div>'}return '<article class="island '+is.cls+'"><div class="band"></div><div class="row1"><div class="glyph">'+is.glyph+'</div><div class="tt"><div class="nm">'+is.name+'</div><div class="sub">'+is.sub+'</div></div><div class="lvl">'+done+'/'+total+'</div></div><div class="nodes">'+nodes+'</div><button class="go" data-start="'+is.key+'">开始闯关</button></article>'}).join('')}function renderAll(){$('#topStars').textContent=save.stars;$('#meStars').textContent=save.stars;const lv=Math.floor(save.stars/10)+1;$('#levelText').textContent='第 '+lv+' 级 · '+(lv===1?'小小小学徒':lv===2?'识字小能手':lv===3?'算术小天才':lv===4?'英语小达人':lv===5?'古诗小学者':'幼儿园大学士');const unlocked=ISLANDS.filter(i=>i.done()>=1).length;$('#islandProgress').textContent='已解锁 '+unlocked+' / '+ISLANDS.length;renderIslands();$('#storyProgress').textContent='已解锁 '+save.storyUnlocked+' / '+STORY.length+' 页';$('#storyBar').style.width=(save.storyUnlocked/STORY.length*100)+'%';renderStory();renderRecent()}function renderStory(){$('#storyPages').innerHTML=STORY.map((p,i)=>{const un=i<save.storyUnlocked;return '<article class="book-page">'+(un?'<img src="'+p.img+'">':'<div class="lock-mask"><img src="'+p.img+'" style="filter:brightness(.5)"><div class="lock-tag">🔒 未解锁</div></div>')+'<div class="cap"><div class="pgno">PAGE 0'+(i+1)+' · '+(un?'已读':'未解锁')+'</div><h3>'+(un?p.title:'？？？')+'</h3><p>'+(un?p.text:'完成练习题后就能翻开这一页啦')+'</p></div></article>'}).join('')}function renderRecent(){const items=save.recent.slice(0,4);if(!items.length){$('#recentRec').innerHTML='<div style="padding:20px;text-align:center;color:var(--dim);font-size:13px">还没有学习记录，去闯第一关吧！</div>';return}$('#recentRec').innerHTML=items.map(r=>'<div class="row"><div class="ic" style="background:'+r.color+'">★</div><div class="tt"><div class="a">'+r.title+'</div><div class="b">'+r.time+'</div></div><div class="n">'+r.stars+'星</div></div>').join('')}const scrim=$('#scrim'),modal=$('#modal'),body=$('#modalBody');function openModal(on){scrim.classList.toggle('on',on);modal.classList.toggle('on',on);modal.style.transform=on?'none':'translateY(100%)';modal.style.display=on?'block':'none';scrim.style.opacity=on?'1':'0';scrim.style.pointerEvents=on?'auto':'none'}scrim.onclick=()=>openModal(false);function record(title,color){save.recent.unshift({title,color,stars:1,time:new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'})});save.recent=save.recent.slice(0,5);persist();renderAll()}function showReward(){sndReward();body.innerHTML='<div class="reward"><img src="https://aka.doubaocdn.com/s/zVCVbYoSBv" alt="答对啦"><h2>太棒了，答对啦！</h2><p>+1 颗星星，绘本新一页已解锁<br>快翻开《芽芽兔的菜园》看看吧</p><button class="go-gold" id="goBook">去看绘本故事</button></div>';$('#goBook').onclick=()=>{sndClick();openModal(false);goTab('book')};speakCN('太棒了，答对啦！')}function completeLevel(islandKey,label,color){save.stars++;if(save.storyUnlocked<STORY.length)save.storyUnlocked++;record(label,color);persist();renderAll();showReward()}function startPinyin(){const lesson=PINYIN_LESSONS[save.pinyinDone]||PINYIN_LESSONS[0];body.innerHTML='<div class="quiz"><span class="tag" style="background:#FFE8DC;color:var(--orange)">拼音岛 · 第 '+(save.pinyinDone+1)+' 关 · '+lesson.desc+'</span><h2>点一点字母，听一听</h2><div class="qsub">跟着芽芽兔大声读出来</div><div class="letter-cards">'+lesson.letters.map(l=>'<button class="letter-card" data-l="'+l+'">'+l+'</button>').join('')+'</div><button class="go" id="finishLevel" style="background:var(--orange)">我读好了，完成本关</button></div>';$$('.letter-card').forEach(c=>c.onclick=()=>{sndClick();$$('.letter-card').forEach(x=>x.classList.remove('speaking'));c.classList.add('speaking');speakCN(c.dataset.l)});$('#finishLevel').onclick=()=>{save.pinyinDone++;completeLevel('pinyin','拼音 · '+lesson.desc,'#FF8A5C')};openModal(true);speakCN('点一点字母，跟我读')}function startMath(){let q=mathQuestion(save.mathDone+2);let answered=0,total=3;function drawQ(){body.innerHTML='<div class="quiz"><span class="tag">数学岛 · 第 '+(save.mathDone+1)+' 关 · 数字 '+(save.mathDone+2)+'</span><div class="quiz-progress"><div class="bar"><i style="width:'+(answered/total*100)+'%"/></div><span class="txt">'+answered+'/'+total+'</span></div><h2>'+q.q+'</h2><div class="qsub">点一点正确的答案</div><div class="opts">'+q.options.map(o=>'<button class="opt" data-v="'+o+'">'+o+'</button>').join('')+'</div></div>';$$('.opt').forEach(o=>o.onclick=()=>{if(o.dataset.v===q.answer){sndCorrect();o.classList.add('right','pop');answered++;save.stars++;setTimeout(()=>{if(answered>=total){if(save.storyUnlocked<STORY.length)save.storyUnlocked++;save.mathDone++;record('数学 · 数字分成','#3FBF86');persist();renderAll();showReward()}else{q=mathQuestion(save.mathDone+2);drawQ()}},500)}else{sndWrong();o.classList.add('wrong');toast('再想一想～')}})}drawQ();openModal(true)}function startStroke(){const s=STROKES[save.strokeDone]||STROKES[0];body.innerHTML='<div class="quiz"><span class="tag" style="background:#EFE6FB;color:var(--purple)">笔画岛 · 第 '+(save.strokeDone+1)+' 关</span><h2>描一描：'+s.name+'</h2><div class="qsub">用手指沿着虚线慢慢画</div><div class="draw-wrap"><canvas id="drawCanvas" width="320" height="220"></canvas><div class="draw-hint">沿着橙色虚线描红，画完点完成</div></div><button class="go" id="finishStroke" style="background:var(--purple)">我描好了</button></div>';openModal(true);setTimeout(()=>{const cv=$('#drawCanvas'),ctx=cv.getContext('2d');s.draw(ctx);let drawing=false;function pos(e){const r=cv.getBoundingClientRect();const t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*320/r.width,y:(t.clientY-r.top)*220/r.height}}cv.onmousedown=cv.ontouchstart=e=>{e.preventDefault();drawing=true;const p=pos(e);ctx.strokeStyle='#9E7BE0';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(p.x,p.y)};cv.onmousemove=cv.ontouchmove=e=>{if(!drawing)return;e.preventDefault();const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()};cv.onmouseup=cv.ontouchend=()=>{drawing=false};$('#finishStroke').onclick=()=>{save.strokeDone++;completeLevel('stroke','笔画 · '+s.name,'#9E7BE0')}},100)}function startEnglish(){const lesson=ENG_LESSONS[save.engDone]||ENG_LESSONS[0];if(lesson.type==='letters'){body.innerHTML='<div class="quiz"><span class="tag" style="background:#E0EDFE;color:var(--blue)">英语岛 · 第 '+(save.engDone+1)+' 关 · '+lesson.desc+'</span><h2>点一点字母</h2><div class="qsub">听一听，跟我读</div><div class="letter-cards">'+lesson.items.map(l=>'<button class="letter-card" data-l="'+l+'">'+l+'</button>').join('')+'</div><button class="go" id="finishLevel" style="background:var(--blue)">我读好了，完成本关</button></div>';$$('.letter-card').forEach(c=>c.onclick=()=>{sndClick();$$('.letter-card').forEach(x=>x.classList.remove('speaking'));c.classList.add('speaking');speakEN(c.dataset.l)});$('#finishLevel').onclick=()=>{save.engDone++;completeLevel('english','英语 · 字母认读','#5B9BF3')}}else{body.innerHTML='<div class="quiz"><span class="tag" style="background:#E0EDFE;color:var(--blue)">英语岛 · 第 '+(save.engDone+1)+' 关 · '+lesson.desc+'</span><h2>点一点单词</h2><div class="qsub">听一听，这是什么意思？</div><div class="letter-cards" style="grid-template-columns:1fr">'+lesson.items.map(w=>'<button class="letter-card eng-word" data-w="'+w[0]+'" style="aspect-ratio:auto;height:56px;font-size:20px">'+w[0]+'<span style="font-size:13px;color:var(--dim);margin-left:8px">'+w[1]+'</span></button>').join('')+'</div><button class="go" id="finishLevel" style="background:var(--blue)">我读好了，完成本关</button></div>';$$('.eng-word').forEach(c=>c.onclick=()=>{sndClick();$$('.eng-word').forEach(x=>x.classList.remove('speaking'));c.classList.add('speaking');speakEN(c.dataset.w)});$('#finishLevel').onclick=()=>{save.engDone++;completeLevel('english','英语 · 单词','#5B9BF3')}}openModal(true)}function startPoem(){const p=POEMS[save.poemDone]||POEMS[0];body.innerHTML='<div class="quiz"><span class="tag" style="background:#D4F0EA;color:var(--teal)">古诗岛 · 第 '+(save.poemDone+1)+' 关</span><h2 style="text-align:center">'+p.title+'</h2><div class="poem-author">'+p.author+'</div><div class="poem-text">'+p.lines.join('<br>')+'</div><button class="go" id="readPoem" style="background:var(--teal)">🔊 朗读古诗</button><button class="go" id="finishLevel" style="background:var(--teal);margin-top:10px">我会背了，完成本关</button></div>';$('#readPoem').onclick=()=>{sndClick();speakCN(p.lines.join('，'))};$('#finishLevel').onclick=()=>{save.poemDone++;completeLevel('poem','古诗 · '+p.title,'#2EB8A5')};openModal(true);setTimeout(()=>speakCN(p.lines.join('，')),400)}function startHistory(){const h=HISTORIES[save.histDone]||HISTORIES[0];body.innerHTML='<div class="quiz"><span class="tag" style="background:#F0E2D4;color:var(--brown)">历史岛 · 第 '+(save.histDone+1)+' 关</span><h2>'+h.title+'</h2><div class="qsub">听完故事，点完成继续</div><div class="history-story">'+h.text+'</div><button class="go" id="readStory" style="background:var(--brown)">🔊 朗读故事</button><button class="go" id="finishLevel" style="background:var(--brown);margin-top:10px">我读完了，完成本关</button></div>';$('#readStory').onclick=()=>{sndClick();speakCN(h.text)});$('#finishLevel').onclick=()=>{save.histDone++;completeLevel('history','历史 · '+h.title,'#C68B59')};openModal(true);setTimeout(()=>speakCN(h.text),400)}const panels=[...$$('.panel')];const tabs=[...$$('.tabbar button')];function goTab(go){tabs.forEach(x=>x.classList.toggle('on',x.dataset.go===go));panels.forEach(p=>p.classList.toggle('on',p.dataset.panel===go));$('#flow').scrollTop=0}tabs.forEach(b=>b.onclick=()=>{sndClick();goTab(b.dataset.go)});$$('[data-start]').forEach(b=>b.onclick=()=>{sndClick();const t=b.dataset.start;if(t==='pinyin')startPinyin();else if(t==='math')startMath();else if(t==='stroke')startStroke();else if(t==='english')startEnglish();else if(t==='poem')startPoem();else if(t==='history')startHistory()});$$('[data-goto]').forEach(el=>el.onclick=()=>{sndClick();goTab(el.dataset.goto)});renderAll();</script></body></html>
